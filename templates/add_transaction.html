{% extends "base.html" %}
{% block title %}Add Transaction{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('transactions') }}">Transactions</a> / Add</div>
<div class="card form-card">
    <h1>Add a Transaction</h1>
    <form method="POST">
        <div class="field">
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>

        <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" step="0.01" min="0" name="amount" placeholder="0.00" required>
        </div>

        <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Groceries, Paycheck">
        </div>

        <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="Optional note">
        </div>

        <div class="field">
            <label for="debt_id">Linked debt <span class="hint">(if this is a debt payment)</span></label>
            <select id="debt_id" name="debt_id">
                <option value="">— Not a debt payment —</option>
                {% for d in debts %}
                <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Transaction</button>
            <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
