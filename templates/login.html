{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-logo">
            <span class="brand-mark" style="width:40px;height:40px;">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="5" r="2.3"/>
                    <line x1="12" y1="7.3" x2="12" y2="21"/>
                    <line x1="7" y1="10" x2="17" y2="10"/>
                    <path d="M5 13a7 7 0 0 0 14 0"/>
                </svg>
            </span>
        </div>
        <h1 style="text-align:center;">Welcome back</h1>
        <p style="text-align:center;">Log in to see your full financial picture.</p>
        <form method="POST">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
