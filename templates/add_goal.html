<!DOCTYPE html>
<html>
<head>
    <title>Add Savings Goal</title>
</head>
<body>
    <h1>Add a Savings Goal</h1>
    <form method="POST">
        <label>Goal Name (e.g. Emergency Fund, Japan Trip):</label>
        <input type="text" name="name" required><br><br>

        <label>Target Amount:</label>
        <input type="number" step="0.01" name="target_amount" required><br><br>

        <label>Current Amount Saved:</label>
        <input type="number" step="0.01" name="current_amount" value="0"><br><br>

        <label>Target Date (optional):</label>
        <input type="date" name="target_date"><br><br>

        <button type="submit">Add Goal</button>
    </form>
    <p><a href="{{ url_for('goals') }}">View goals</a> | <a href="{{ url_for('home') }}">Back to home</a></p>
</body>
</html>
