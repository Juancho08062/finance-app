{% extends "base.html" %}
{% block title %}Add Allocation{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('summary') }}">Summary</a> / Add Allocation</div>
<div class="card form-card">
    <h1>Add a Budget Allocation</h1>
    <form method="POST">
        <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Roth IRA, 401k, Stock Market" required>
        </div>

        <div class="field">
            <label for="percentage">Percentage</label>
            <input type="number" id="percentage" step="0.01" min="0" max="100" name="percentage" placeholder="0" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Allocation</button>
            <a href="{{ url_for('summary') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
