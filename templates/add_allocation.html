<!DOCTYPE html>
<html>
<head>
    <title>Add Allocation</title>
</head>
<body>
    <h1>Add a Budget Allocation</h1>
    <form method="POST">
        <label>Category (e.g. Roth IRA, 401k, Stock Market):</label>
        <input type="text" name="category" required><br><br>

        <label>Percentage:</label>
        <input type="number" step="0.01" name="percentage" required><br><br>

        <button type="submit">Add Allocation</button>
    </form>
    <p><a href="{{ url_for('summary') }}">View summary</a> | <a href="{{ url_for('home') }}">Back to home</a></p>
</body>
</html>
