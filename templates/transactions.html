<!DOCTYPE html>
<html>
<head>
    <title>Your Transactions</title>
</head>
<body>
    <h1>Your Transactions</h1>
    <p><a href="{{ url_for('add_transaction') }}">Add a new transaction</a> | <a href="{{ url_for('home') }}">Back to home</a></p>

    <table border="1" cellpadding="8">
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
        </tr>
       {% for t in transactions %}
<tr>
    <td>{{ t.date }}</td>
    <td>{{ t.type }}</td>
    <td>{{ t.category }}</td>
    <td>{{ t.description }}</td>
    <td>${{ t.amount }}</td>
    <td><a href="{{ url_for('delete_transaction', id=t.id) }}" onclick="return confirm('Delete this transaction?')">Delete</a></td>
</tr>
{% endfor %}
    </table>
</body>
</html>
