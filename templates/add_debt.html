<!DOCTYPE html>
<html>
<head>
    <title>Add Debt</title>
</head>
<body>
    <h1>Add a Debt</h1>
    <form method="POST">
        <label>Name:</label>
        <input type="text" name="name" required><br><br>

        <label>Total Amount:</label>
        <input type="number" step="0.01" name="total_amount" required><br><br>

        <label>Remaining Balance:</label>
        <input type="number" step="0.01" name="remaining_balance" required><br><br>

        <label>Interest Rate (%):</label>
        <input type="number" step="0.01" name="interest_rate"><br><br>

        <label>Minimum Payment:</label>
        <input type="number" step="0.01" name="minimum_payment"><br><br>

        <button type="submit">Add Debt</button>
    </form>
    <p><a href="{{ url_for('debts') }}">View debts</a> | <a href="{{ url_for('home') }}">Back to home</a></p>
</body>
</html>
