{% extends "base.html" %}
{% block title %}Add Debt{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('debts') }}">Debts</a> / Add</div>
<div class="card form-card">
    <h1>Add a Debt</h1>
    <form method="POST">
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Student Loan, Visa Card" required>
        </div>

        <div class="field">
            <label for="total_amount">Total Amount</label>
            <input type="number" id="total_amount" step="0.01" min="0" name="total_amount" placeholder="0.00" required>
        </div>

        <div class="field">
            <label for="remaining_balance">Remaining Balance</label>
            <input type="number" id="remaining_balance" step="0.01" min="0" name="remaining_balance" placeholder="0.00" required>
        </div>

        <div class="field">
            <label for="interest_rate">Interest Rate (%) <span class="hint">optional</span></label>
            <input type="number" id="interest_rate" step="0.01" min="0" name="interest_rate">
        </div>

        <div class="field">
            <label for="minimum_payment">Minimum Payment <span class="hint">optional</span></label>
            <input type="number" id="minimum_payment" step="0.01" min="0" name="minimum_payment">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Debt</button>
            <a href="{{ url_for('debts') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
