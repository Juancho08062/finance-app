{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-logo">
            <span class="brand-mark" style="width:40px;height:40px;">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="5" r="2.3"/>
                    <line x1="12" y1="7.3" x2="12" y2="21"/>
                    <line x1="7" y1="10" x2="17" y2="10"/>
                    <path d="M5 13a7 7 0 0 0 14 0"/>
                </svg>
            </span>
        </div>
        <h1 style="text-align:center;">Create your account</h1>
        <p style="text-align:center;">Takes less than a minute — you can fill in the rest later.</p>
        <form method="POST">
            <div class="field">
                <label for="first_name">First name <span class="hint">(optional)</span></label>
                <input type="text" id="first_name" name="first_name" placeholder="Jane">
            </div>
            <div class="field">
                <label for="last_name">Last name <span class="hint">(optional)</span></label>
                <input type="text" id="last_name" name="last_name" placeholder="Doe">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="field">
                <label for="age">Age <span class="hint">(optional — used to personalize recommendations)</span></label>
                <input type="number" id="age" name="age" min="1" max="120">
            </div>
            <div class="field">
                <label for="income">Annual income <span class="hint">(optional)</span></label>
                <input type="number" id="income" name="income" step="0.01" min="0">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
