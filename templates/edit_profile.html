<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
</head>
<body>
    <h1>Edit Your Profile</h1>
    <form method="POST">
        <label>Email:</label>
        <input type="email" name="email" value="{{ current_user.email }}" required><br><br>

        <label>Age:</label>
        <input type="number" name="age" value="{{ current_user.age or '' }}"><br><br>

        <label>Annual Income:</label>
        <input type="number" step="0.01" name="income" value="{{ current_user.income or '' }}"><br><br>

        <button type="submit">Save Changes</button>
    </form>
    <p><a href="{{ url_for('home') }}">Back to home</a></p>
</body>
</html>
